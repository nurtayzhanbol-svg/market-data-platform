x-app: &app
  build: .
  restart: on-failure
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    DATABASE_URL: postgresql://market:market@postgres:5432/market
    REDIS_URL: redis://redis:6379/0
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ["5432:5432"]
    healthcheck:
      test: pg_isready -U market
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      retries: 20

  producer:
    <<: *app
    command: python -m app.producer

  consumer:
    <<: *app
    command: python -m app.consumer

  api:
    <<: *app
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
